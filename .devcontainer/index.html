<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iron Man ASCII Video</title>
    <style>
      :root {
        --bg: #060915;
        --panel: #0d1220;
        --red: #ff4d4d;
        --gold: #ffd76a;
        --blue: #6fd3ff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(255, 111, 97, 0.18), transparent 35%),
          radial-gradient(circle at bottom, rgba(64, 164, 255, 0.12), transparent 30%),
          var(--bg);
        color: white;
        font-family: Arial, sans-serif;
      }

      .frame {
        width: min(92vw, 1200px);
        background: rgba(13, 18, 32, 0.8);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        padding: 18px;
      }

      .title {
        margin: 0 0 14px;
        text-align: center;
        font-size: clamp(18px, 2vw, 30px);
        letter-spacing: 2px;
        color: var(--gold);
        text-shadow: 0 0 12px rgba(255, 215, 106, 0.7);
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        background: #090b14;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.08);
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <h1 class="title">IRON MAN ASCII</h1>
      <canvas id="asciiCanvas" width="1100" height="620"></canvas>
    </div>

    <video id="sourceVideo" src="video.mp4" muted playsinline loop autoplay style="display:none"></video>

    <script>
      const canvas = document.getElementById('asciiCanvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      const video = document.getElementById('sourceVideo');

      const chars = '@%#*+=-:. ';
      const buffer = document.createElement('canvas');
      const bctx = buffer.getContext('2d', { willReadFrequently: true });

      canvas.width = 1920;
      canvas.height = 1080;

      function drawAscii() {
        const w = canvas.width;
        const h = canvas.height;
        const cols = 220;
        const rows = 100;
        const cellW = w / cols;
        const cellH = h / rows;

        buffer.width = cols * 2;
        buffer.height = rows * 2;
        bctx.clearRect(0, 0, buffer.width, buffer.height);
        bctx.filter = 'contrast(2.8) saturate(3.1) brightness(1.3)';
        bctx.drawImage(video, 0, 0, buffer.width, buffer.height);

        const img = bctx.getImageData(0, 0, buffer.width, buffer.height);
        const data = img.data;

        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#02060b';
        ctx.fillRect(0, 0, w, h);
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';

        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            let r = 0, g = 0, b = 0, count = 0;
            for (let yy = 0; yy < 2; yy++) {
              for (let xx = 0; xx < 2; xx++) {
                const px = (y * 2 + yy) * buffer.width + (x * 2 + xx);
                const i = px * 4;
                r += data[i];
                g += data[i + 1];
                b += data[i + 2];
                count++;
              }
            }

            const avg = (r + g + b) / (3 * count);
            const brightness = avg / 255;
            const red = r / count;
            const green = g / count;
            const blue = b / count;

            if (avg < 10) {
              ctx.fillStyle = '#02060b';
              ctx.fillText(' ', x * cellW + 2, y * cellH + 2);
              continue;
            }

            const warmBoost = (red > 150 && green < 140 && blue < 120) ? 0.22 : 0;
            const intensity = Math.min(1, Math.max(0, brightness + warmBoost));
            const index = Math.max(0, Math.min(chars.length - 1, Math.floor((1 - intensity) * (chars.length - 1))));
            const ch = chars[index];

            const finalR = Math.min(255, 150 + intensity * 105);
            const finalG = Math.min(255, 55 + intensity * 180);
            const finalB = Math.min(255, 25 + intensity * 125);

            ctx.fillStyle = `rgb(${finalR}, ${finalG}, ${finalB})`;
            ctx.font = 'bold 11px monospace';
            ctx.fillText(ch, x * cellW + 2, y * cellH + 2);
          }
        }

        requestAnimationFrame(drawAscii);
      }

      video.addEventListener('loadeddata', () => {
        video.play();
        requestAnimationFrame(drawAscii);
      });

      video.addEventListener('error', () => {
        alert('Could not load video.mp4. Make sure the file is in the same folder as this page.');
      });
    </script>
  </body>
</html>
